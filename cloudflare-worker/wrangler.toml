name = "billowing-band-06cd"
main = "src/index.js"
compatibility_date = "2026-06-04"

[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "QUOTE_STREAM_SOURCE"
class_name = "QuoteStreamSource"

[[durable_objects.bindings]]
name = "QUOTE_STREAM_SHARD"
class_name = "QuoteStreamShard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuoteStreamSource", "QuoteStreamShard"]

[[ratelimits]]
name = "STREAM_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 100
  period = 10

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 50
  period = 10

[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 5
  period = 10

[[kv_namespaces]]
binding = "ALERT_STATE"
id = "f5254cd9cfde4f6397dd16c89cff1349"
