name: Build APK / AAB

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'apk-debug'
        type: choice
        options:
          - apk-debug
          - apk-release
          - aab-release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug)
        if: ${{ github.event_name == 'push' || inputs.build_type == 'apk-debug' }}
        run: flutter build apk --debug

      - name: Build APK (release)
        if: ${{ inputs.build_type == 'apk-release' }}
        run: flutter build apk --release

      - name: Build AAB (release)
        if: ${{ inputs.build_type == 'aab-release' }}
        run: flutter build appbundle --release

      - name: Upload APK (debug)
        if: ${{ github.event_name == 'push' || inputs.build_type == 'apk-debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: qld-apk-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload APK (release)
        if: ${{ inputs.build_type == 'apk-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: qld-apk-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB (release)
        if: ${{ inputs.build_type == 'aab-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: qld-aab-release-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
